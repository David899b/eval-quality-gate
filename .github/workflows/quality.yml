name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: quality (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Format check (ruff)
        run: ruff format --check .

      - name: Type check (mypy)
        run: mypy src

      - name: Tests + coverage
        run: pytest --cov --cov-report=xml --cov-report=term-missing --cov-fail-under=80

      - name: Mutation testing (mutmut)
        run: python scripts/check_mutation_score.py --threshold 70

      - name: SAST (bandit)
        run: |
          pip install bandit
          bandit -r src -q -ll

      - name: SCA (pip-audit)
        run: |
          pip install --upgrade setuptools pip-audit
          pip-audit

      - name: Run the gate on the golden set
        run: python -m eval_quality_gate --golden data/golden_set.json --outputs data/outputs.json --pricing data/pricing.json --report-dir reports

      - name: Upload evaluation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report-${{ matrix.python-version }}
          path: reports/
          if-no-files-found: warn
