[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "eval-quality-gate"
version = "1.0.0"
description = "A reproducible, CI-enforced evaluation gate for LLM/RAG systems across quality, safety, cost, latency and governance."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "David Bautista" }]
keywords = ["llm", "evaluation", "evals", "ci", "quality-gate", "rag", "safety"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff==0.6.9",
    "mypy>=1.11",
    "mutmut>=2.4",
]

[project.scripts]
eval-quality-gate = "eval_quality_gate.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: marks slow tests",
    "integration: marks tests that need external services",
    "smoke: critical-path smoke tests",
]

[tool.coverage.run]
source = ["src/eval_quality_gate"]
branch = true
omit = ["*/tests/*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "S"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
"scripts/*" = ["S603", "S607"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = "eval_quality_gate.*"
ignore_missing_imports = true

[tool.mutmut]
paths_to_mutate = "src/eval_quality_gate/"
tests_dir = "tests/"
